name: pachadata_training
version: "1.0.0"
profile: pachadata_training

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

vars:
  # Folder holding the two deliveries of the source system, relative to the project.
  data_dir: data

models:
  pachadata_training:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table

data_tests:
  pachadata_training:
    # Keep the failing rows of every test in the main_dbt_test__audit schema.
    +store_failures: true
