models:
  - name: stg_enrollments
    columns:
      - name: enrollment_id
        data_tests:
          - unique
          - not_null
      - name: session_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_course_sessions')
                field: session_id

  - name: stg_course_sessions
    columns:
      - name: session_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [PLANNED, OPEN, CONFIRMED, COMPLETED, CANCELLED]
